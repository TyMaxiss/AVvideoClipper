name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (Qt runtime, ffmpeg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  windows:
    name: Windows program
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Bundle ffmpeg
        run: python packaging/fetch_ffmpeg.py
      - name: Build
        run: pyinstaller packaging/avclipper.spec --noconfirm
      - name: Self-test of the built program
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          $p = Start-Process -FilePath "dist\AVvideoClipper\AVvideoClipper.exe" -ArgumentList "--self-test", "`"$log`"" -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Add readme
        shell: pwsh
        run: Copy-Item README.md dist\AVvideoClipper\README.md
      - uses: actions/upload-artifact@v4
        with:
          name: AVvideoClipper-windows
          path: dist/AVvideoClipper
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist\AVvideoClipper -DestinationPath AVvideoClipper-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AV Video Clipper ${{ github.ref_name }}
          files: AVvideoClipper-windows.zip
          body: |
            Программа вырезает из AV-видеозаписей белый шум («снег») и оставляет только видео.

            **Как запустить (Windows 10/11, 64 бит)**
            1. Скачайте `AVvideoClipper-windows.zip` в разделе Assets ниже.
            2. Распакуйте архив в любую папку.
            3. Запустите `AVvideoClipper\AVvideoClipper.exe`. Устанавливать ничего не нужно, ffmpeg уже внутри.

            Если Windows SmartScreen предупредит о неизвестном издателе, нажмите «Подробнее» → «Выполнить в любом случае».

            Подробная инструкция: [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md).
